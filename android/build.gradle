allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    // Fix namespace (AGP 8+) + aligne compileOptions Java 17 sur l'extension android
    // directement — plus fiable que tasks.withType(JavaCompile) qui peut être écrasé.
    plugins.withId('com.android.library') {
        if (android.namespace == null) {
            android.namespace = project.group.toString()
        }
        android.compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
    }
    // Aligne kotlinc sur Java 17 pour tous les sous-projets (plugins inclus).
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
